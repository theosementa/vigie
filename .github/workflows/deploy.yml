name: Deploy
# main    -> production      (host port 8101 by default)
# preprod -> pre-production  (host port 8102 by default)
# Instance specifics (folders, ports, URLs) come from repository variables, see CONTRIBUTING.md.
# A feature goes to `preprod` first; once validated, `preprod` is merged into `main`.
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:           # "Run workflow" button (pick the branch), also used to test the Discord webhook

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false    # a running deploy is never interrupted

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, vigie]     # label = this project's runner (one runner, so the two deploys queue)
    timeout-minutes: 60
    env:
      BRANCH: ${{ github.ref_name }}
      PROD: ${{ github.ref_name == 'main' }}
      DEPLOY_DIR: ${{ github.ref_name == 'main' && (vars.DEPLOY_DIR || '~/projects/vigie') || (vars.DEPLOY_DIR_PREPROD || '~/projects/vigie-pp') }}
      # Separate compose projects: containers and volumes (database) are never shared.
      COMPOSE_PROJECT_NAME: ${{ github.ref_name == 'main' && 'vigie' || 'vigie-pp' }}
      HTTP_PORT: ${{ github.ref_name == 'main' && (vars.HTTP_PORT || '8101') || (vars.HTTP_PORT_PREPROD || '8102') }}
      PROJECT: ${{ github.ref_name == 'main' && 'Vigie' || 'Vigie (preprod)' }}
      SITE_URL: ${{ github.ref_name == 'main' && vars.SITE_URL || vars.SITE_URL_PREPROD }}   # optional, link in the Discord message
      PP_ALLOWED_EMAILS: ${{ vars.PREPROD_ALLOWED_EMAILS }}
      PP_PUBLIC_URL: ${{ vars.PREPROD_PUBLIC_URL }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      GH_TOKEN: ${{ github.token }}
      # COMPOSE_FILE: docker-compose.prod.yml   # uncomment if not docker-compose.yml
    steps:
      - name: Start timer
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Update the code
        run: |
          set -euo pipefail
          DIR="${DEPLOY_DIR/#\~/$HOME}"
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git_auth() { git -c "http.https://github.com/.extraheader=$AUTH" "$@"; }
          [ -d "$DIR/.git" ] || git_auth clone "$REPO_URL" "$DIR"
          cd "$DIR"
          git_auth fetch origin "$BRANCH"
          # The deploy folder only mirrors the branch (preprod may be force-pushed).
          git checkout -B "$BRANCH" "origin/$BRANCH"
          if [ ! -f .env ]; then
            if [ "$PROD" != true ] && [ -f .env.preprod.example ]; then
              # First preprod deploy: start from the template and generate the secrets.
              cp .env.preprod.example .env
              sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
              [ -z "$PP_ALLOWED_EMAILS" ] || sed -i "s|^ALLOWED_EMAILS=.*|ALLOWED_EMAILS=$PP_ALLOWED_EMAILS|" .env
              [ -z "$PP_PUBLIC_URL" ] || sed -i "s|^PUBLIC_URL=.*|PUBLIC_URL=$PP_PUBLIC_URL|" .env
              echo "Created $DIR/.env from .env.preprod.example"
            else
              echo "::error::$DIR/.env missing"; exit 1
            fi
          fi
          git log -1 --oneline

      - name: Build and restart the stack
        env:
          BUILD_NUMBER: ${{ github.run_number }}   # shown in the app settings, same as the Discord #build
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR/#\~/$HOME}"
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Check the site answers
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR/#\~/$HOME}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$HTTP_PORT/" || true)
            [ "$code" = 200 ] && exit 0      # adapt to the expected code (401 behind auth)
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 40
          echo "::error::site not answering (last code: $code)"; exit 1

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          BUILD: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "::warning::secret DISCORD_WEBHOOK_URL missing"; exit 0; }
          SECS=$(( $(date +%s) - DEPLOY_START ))
          DURATION="$((SECS / 60))m $((SECS % 60))s"
          if [ "$STATUS" = success ] && [ -n "$SITE_URL" ]; then TITLE="✅ $PROJECT deployed"; COLOR=3066993; SITE="$SITE_URL"
          elif [ "$STATUS" = success ]; then TITLE="✅ $PROJECT deployed"; COLOR=3066993; SITE="$RUN_URL"
          else TITLE="❌ $PROJECT deploy $STATUS"; COLOR=15158332; SITE="$RUN_URL"; fi
          curl -fsS -H 'Content-Type: application/json' -X POST "$DISCORD_WEBHOOK_URL" -d "$(printf '%s' \
            '{"embeds":[{"title":"'"$TITLE"'","color":'"$COLOR"',"fields":[' \
            '{"name":"Project","value":"'"$PROJECT"'","inline":true},' \
            '{"name":"Build","value":"#'"$BUILD"'","inline":true},' \
            '{"name":"Duration","value":"'"$DURATION"'","inline":true},' \
            '{"name":"Link","value":"'"$SITE"'"}' \
            ']}]}')"
